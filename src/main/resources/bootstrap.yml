# mybatis-plus related configurations
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-value: 1 # logically deleted value(default 1)
      logic-not-delete-value: 0 # logically not deleted value(default 0)
  mapper-locations: classpath:mapper/*.xml
  #entity scan. separate packages with comma or semicolon
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# print sql statements for debug
#------------mybatis configurations--------------------------

---
logging.level.root: info
logging:
  level:
    org.springframework: info
    org.springframework.security: info

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: OauthHikariCP
      readOnly: false
      auto-commit: true
      minimum-idle: 5
      idle-timeout: 60000
      maximum-pool-size: 16
      max-lifetime: 1800000
      connection-timeout: 60000
      loginTimeout: 5
      connection-test-query: SELECT 1
      validation-timeout: 3000