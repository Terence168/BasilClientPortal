  #username: decsrvdbo
  #password: decsrvdbop

security:
  # urls which do not need authentication
  permit-all:
    urls:
      - /webjars/**
      - /swagger-resources
      - /swagger-ui.html
      - /swagger-resources/**
      - /v2/**
      - /internal/**
      - /login
      - /error
      - /api/**
  # CORS configuration
  cors:
    configs:
      - path: '/**'
        origins: '*'
        headers: '*'
        methods: '*'
        allowCredentials: true
        maxAge: 3600

logging:
  level:
    org.springframework.security: debug

server:
  servlet:
    context-path: /
    session:
      timeout: 1800
  port: 8888
  tomcat:
    remote_ip_header: X-Forwarded-For
    protocol_header: X-Forwarded-Proto
    port-header: X-Forwarded-Port
