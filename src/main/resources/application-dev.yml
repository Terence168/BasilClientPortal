security:
  # urls which do not need authentication
  permit-all:
    urls:
      - /webjars/**
      - /swagger-resources
      - /swagger-ui.html
      - /swagger-resources/**
      - /v2/**
      - /internal/**
      - /error
      - /api/**
      - /password/**

  # CORS configuration
  cors:
    configs:
      - path: "/**"
        #        origins: 'http://localhost:8080'
        #       origins: 'http://216.238.144.197:8888/'
        origins: "*"
        headers: "*"
        methods: "*"
        allowCredentials: true
        maxAge: 3600

#  configuration:
#    map-underscore-to-camel-case: false

#logging:
#  config: logback-spring.xml
#  level:
#    org.springframework.security: debug

server:
  servlet:
    context-path: /api/v1/
    session:
      timeout: 3600
  port: 8081
  tomcat:
    remote_ip_header: X-Forwarded-For
    protocol_header: X-Forwarded-Proto
    port-header: X-Forwarded-Port
    basedir: ./
    accesslog:
      enabled: true
      directory: service-logs
  ssl:
    enabled: false
    key-store: server.keystore
    key-store-password: ${BASIL_DEV_SSL_KEY_STORE_PASSWORD}
    key-store-type: JKS
    #trust-store: src/test/resources/trust.keystore
    #trust-store-password: ${BASIL_DEV_SSL_TRUST_STORE_PASSWORD}
    #trust-store-type: JKS
    #trust-store-provider: SUN
    #client-auth: need
http_pool:
  max_total: 200
  default_max_per_route: 100
  connect_timeout: 5000
  connection_request_timeout: 1000
  socket_timeout: 65000
  validate_after_inactivity: 2000

frontend:
  urls:
    activate: http://localhost:9000/activate-user/
    change: http://localhost:9000/activate-user/
    forgot: http://localhost:9000/activate-user/
    reset: http://localhost:9000/activate-user/

aws:
  enabled: false
  local_development: false
  region: us-east-1
  accessKeyId: ${BASIL_DEV_AWS_ACCESS_KEY_ID}
  secretKey: ${BASIL_DEV_AWS_SECRET_KEY}
  sessionToken: ${BASIL_DEV_AWS_SESSION_TOKEN}
  threads:
    min: 10
    max: 30
    queueLimit: 200

rma:
  file-storage:
    # dev 环境禁用 S3，附件统一回落到项目根目录 local-root
    use-s3: false

mail:
  smtp:
    # dev 环境启用 SMTP 账号密码发信，不使用 AWS SES
    enabled: true
    host: mail.paxsz.com
    port: 587
    username: paxinfo
    # 建议通过环境变量覆盖真实密码，避免明文提交凭据
    password: ${PAX_DEV_SMTP_PASSWORD}
    # from 地址可按实际邮箱策略调整（若服务器要求完整地址，请改为对应邮箱）
    from: paxinfo@paxsz.com
    auth: true
    starttls: true

contact-rma:
  mail:
    to: zhouxj@paxsz.com
