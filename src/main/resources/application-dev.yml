      - /webjars/**
      - /swagger-resources
      - /swagger-ui.html
      - /swagger-resources/**
      - /v2/**
      - /internal/**
      - /error
      - /api/**
      - /api/v1/**
#      - /user/**
      - /password/**
#      - /privilege/**
#      - /rma/**

  # CORS configuration
