spring:
  application:
    name: basil
  profiles:
    active: dev
  http:
    encoding:
      force: true
      charset: UTF-8
      enabled: true

rma:
  file-storage:
    # Default attachment storage bucket
    bucket: basil-uat-cp-file-storage
    use-s3: true
    # Final object key looks like tickets/{ticketId}/xxx
    base-prefix: tickets
    # Local fallback directory when S3 is unavailable
    local-root: ./basil-uat-cp-file-storage
    # Presigned URL expiration in minutes
    presign-expire-minutes: 30

contact-rma:
  mail:
    to: RMAsupport@pax.us
