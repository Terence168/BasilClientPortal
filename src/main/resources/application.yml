spring:
  application:
    name: basil
  profiles:
    active: dev
  http:
    encoding:
      force:  true
      charset: UTF-8
      enabled: true

rma:
  file-storage:
    # 工单附件默认存储桶（需求指定）
    bucket: basil-uat-cp-file-storage
    use-s3: true
    # 工单附件目录前缀：最终路径形如 tickets/{ticketId}/xxx
    base-prefix: tickets
    # 当 S3 不可用时，本地回退目录（相对项目根目录）
    local-root: ./basil-uat-cp-file-storage
    # 预签名 URL 过期时间（分钟）
    presign-expire-minutes: 30

mail:
  smtp:
    enabled: false

contact-rma:
  mail:
    to: RMAsupport@pax.us
